[package]
name = "mind"
version = "0.1.0"
description = "MCP server exposing a Syncthing-shared notes folder: cheatsheets, things worth knowing, advice, and interesting finds."
authors = ["wallago"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/wallago/mind"
keywords = [
  "http",
  "mcp",
]
categories = [
  "command-line-utilities",
  "web-programming::http-server",
]
edition = "2024"
rust-version = "1.100"
include = ["src/**/*", "Cargo.*", "LICENSE*", "README.md", "CHANGELOG.md"]

[dependencies]
better-panic = "0.3.0"
clap = { version = "4.6.6", features = [
  "derive",
  "env",
  "wrap_help",
  "cargo",
] }
dirs = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.19"
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

axum = { version = "0.8.9", features = ["ws"] }

base64 = "0.22.1"
form_urlencoded = "1.2.2"
hmac = "0.12.1"
rmcp = { version = "3.7.0", features = [
  "server",
  "macros",
  "transport-streamable-http-server",
] }
serde_json = "1.0.154"
sha2 = "0.10.9"
subtle = "2.6.1"

[dev-dependencies]
pretty_assertions = "1.4.1"
rstest            = "0.26"
tower             = { version = "0.5.3", features = ["util"] }

[profile.dev]
opt-level = 0
debug     = true

[profile.test]
opt-level = 0
debug     = true

[profile.release]
opt-level     = 3
debug         = false
panic         = "abort"
lto           = true
codegen-units = 1
strip         = true

[profile.bench]
opt-level = 3
debug     = false

[lints.rust]
missing_docs                  = "warn"
missing_debug_implementations = "warn"
unreachable_pub               = "warn"
unused_qualifications         = "warn"

[lints.clippy]
pedantic                      = { level = "warn", priority = -1 }
unwrap_used                   = "warn"
expect_used                   = "warn"
panic                         = "warn"
todo                          = "warn"
dbg_macro                     = "warn"
print_stdout                  = "warn"
missing_docs_in_private_items = "warn"
